[project]
name = "gamesdb"
version = "1.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pathlib>=1.0.1",
    "opencv-python>=4.10.0.84",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "tqdm>=4.67.1",
]

[project.scripts]
gamesdb = "gamesdb.cli:main"

[tool.setuptools.packages.find]
include = ["gamesdb*"]
exclude = ["datasets*"]

[tool.setuptools.package-data]
gamesdb = ["data/config/*.yaml"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
