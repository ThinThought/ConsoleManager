[project]
name = "tt-gamesdb"
version = "1.0.3"
description = "Add your description here"
readme = "readme.md"
requires-python = ">=3.13"
dependencies = [
    "opencv-python>=4.10.0.84",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "tqdm>=4.67.1",
]

[project.scripts]
gamesdb = "tt_gamesdb.gamesdb.cli:main"

[tool.setuptools.packages.find]
include = ["tt_gamesdb.gamesdb*"]

[tool.setuptools.package-data]
"tt_gamesdb.gamesdb" = ["data/config/*.yaml"]

